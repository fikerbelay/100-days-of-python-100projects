<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Caesar Cipher Tool</h1>
            <p class="subtitle">Encrypt and decrypt messages using the Caesar cipher</p>
        </header>

        <main>
            <div class="input-section">
                <div class="form-group">
                    <label for="messageInput">Your Message</label>
                    <textarea id="messageInput" placeholder="Type your message here..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Operation Mode</label>
                    <div class="mode-selector">
                        <button class="mode-btn active" data-mode="encode">Encrypt</button>
                        <button class="mode-btn" data-mode="decode">Decrypt</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="shiftInput">Shift Amount (1-26)</label>
                    <div class="shift-control">
                        <button class="shift-btn" id="shiftDecrease">-</button>
                        <input type="number" id="shiftInput" min="1" max="26" value="3">
                        <button class="shift-btn" id="shiftIncrease">+</button>
                    </div>
                    <div class="shift-indicator">
                        <div class="shift-track">
                            <div class="shift-fill" id="shiftFill" style="width: 11.5%"></div>
                        </div>
                        <span id="shiftDisplay">3</span>
                    </div>
                </div>

                <button id="processBtn" class="process-btn">Process Message</button>
            </div>

            <div class="output-section" id="outputSection" style="display: none;">
                <h2>Result</h2>
                <div class="result-box">
                    <div class="result-item">
                        <span class="result-label">Original:</span>
                        <span class="result-text" id="originalText"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Processed:</span>
                        <span class="result-text highlight" id="processedText"></span>
                    </div>
                </div>

                <div class="stats-box">
                    <h3>Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Shift Used</span>
                            <span class="stat-value" id="statShift">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Mode</span>
                            <span class="stat-value" id="statMode">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Message Length</span>
                            <span class="stat-value" id="statLength">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Alphabet Size</span>
                            <span class="stat-value" id="statAlphabet">26</span>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="copyBtn" class="action-btn">Copy Result</button>
                    <button id="clearBtn" class="action-btn">Clear All</button>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </main>

        <footer>
            <p>Enter your message, choose a mode, set the shift, and click Process</p>
        </footer>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const shiftInput = document.getElementById('shiftInput');
        const shiftDisplay = document.getElementById('shiftDisplay');
        const shiftFill = document.getElementById('shiftFill');
        const processBtn = document.getElementById('processBtn');
        const outputSection = document.getElementById('outputSection');
        const originalText = document.getElementById('originalText');
        const processedText = document.getElementById('processedText');
        const statShift = document.getElementById('statShift');
        const statMode = document.getElementById('statMode');
        const statLength = document.getElementById('statLength');
        const errorMessage = document.getElementById('errorMessage');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let currentMode = 'encode';

        // Mode selection
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                clearOutput();
            });
        });

        // Shift controls
        function updateShiftDisplay() {
            let value = parseInt(shiftInput.value) || 1;
            value = Math.max(1, Math.min(26, value));
            shiftInput.value = value;
            shiftDisplay.textContent = value;
            shiftFill.style.width = (value / 26 * 100) + '%';
            clearOutput();
        }

        shiftInput.addEventListener('input', updateShiftDisplay);

        document.getElementById('shiftDecrease').addEventListener('click', function() {
            let value = parseInt(shiftInput.value) || 1;
            shiftInput.value = Math.max(1, value - 1);
            updateShiftDisplay();
        });

        document.getElementById('shiftIncrease').addEventListener('click', function() {
            let value = parseInt(shiftInput.value) || 1;
            shiftInput.value = Math.min(26, value + 1);
            updateShiftDisplay();
        });

        // Process button
        processBtn.addEventListener('click', function() {
            const text = messageInput.value.trim();
            const shift = parseInt(shiftInput.value) || 1;

            if (!text) {
                showError('Please enter a message');
                return;
            }

            processBtn.textContent = 'Processing...';
            processBtn.disabled = true;
            hideError();

            fetch('/api/process', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    text: text,
                    shift: shift,
                    mode: currentMode
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Server error');
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayResult(data);
            })
            .catch(error => {
                showError(error.message);
            })
            .finally(() => {
                processBtn.textContent = 'Process Message';
                processBtn.disabled = false;
            });
        });

        function displayResult(data) {
            originalText.textContent = data.original;
            processedText.textContent = data.result;
            statShift.textContent = data.shift;
            statMode.textContent = data.mode.charAt(0).toUpperCase() + data.mode.slice(1);
            statLength.textContent = data.stats.processed_length;
            outputSection.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 4000);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function clearOutput() {
            outputSection.style.display = 'none';
        }

        copyBtn.addEventListener('click', function() {
            const text = processedText.textContent;
            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    this.textContent = 'Copied!';
                    setTimeout(() => {
                        this.textContent = 'Copy Result';
                    }, 2000);
                });
            }
        });

        clearBtn.addEventListener('click', function() {
            messageInput.value = '';
            shiftInput.value = 3;
            updateShiftDisplay();
            clearOutput();
            hideError();
            messageInput.focus();
        });

        updateShiftDisplay();
        messageInput.focus();
    </script>
</body>
</html>
